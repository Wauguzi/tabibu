name: labeler

# pull_request_target reads the labeler config from main, so a PR cannot relabel itself.
# Safe only because this job never checks out PR code.
on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Apply path-derived labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Only ever add; never strip a label a person applied.
          sync-labels: false
