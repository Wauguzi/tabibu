name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      # Setting a Flutter version is what makes the workflow run `flutter pub
      # get`; without it, it runs `dart pub get` and fails on a Flutter app.
      # "3.x" resolves to the newest 3.* stable, so CI follows local Flutter
      # upgrades. Floating is safe here because this job only resolves
      # dependencies. Never point it at pubspec.yaml: flutter-action cannot
      # match a caret range like ^3.47.0 and the job fails.
      flutter_version: "3.x"
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      # Never shipped in an app build, so their licenses do not apply to it:
      # antlr4 and pubspec_lock_parse arrive only through dev tools
      # (fake_cloud_firestore, bloc_lint); dbus, geoclue and gsettings are
      # Linux-only plugin code, and Tabibu has no Linux target. Re-check this
      # list if a Linux target is ever added.
      skip_packages: "antlr4,pubspec_lock_parse,dbus,geoclue,gsettings"
