name: Bug report
description: Something in Tabibu does not work as it should.
title: "[Bug]: "
labels: ["type/fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. **Never include real patient information**: no names,
        phone numbers, results, or images of slides or smears. Use a test account and made-up
        data, and blur anything personal in a screenshot.

        A security vulnerability does not belong here: report it privately, as SECURITY.md
        describes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a doctor
        2. Open Cases
        3. ...
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Patient
        - Doctor
        - Pathologist
        - Not signed in
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the profile screen, for example v1.0.02.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Kiswahili
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Optional. Blur anything personal first.
  - type: checkboxes
    id: no-patient-data
    attributes:
      label: Patient information
      options:
        - label: This report contains no real patient information.
          required: true
