# Path-derived labels only. type/*, P1-P4, needs/* and clinical-safety come from the CRQ.

"security-boundary":
  - changed-files:
      - any-glob-to-any-file:
          - "firestore.rules"
          - "storage.rules"
          - "firestore.indexes.json"
          - "functions/**"
          - "test/firestore_rules/**"

