name: tabibu
description: AI pre-read for pathologists in Kenya, starting with cancer, plus outbreak alerts from every confirmed result for a notifiable disease.
version: 1.0.04+1004
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ^3.47.8

dependencies:
  animations: ^3.0.0
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cloud_firestore: ^6.10.2
  cloud_functions: ^6.5.1
  collection: ^1.19.1
  cupertino_ui: ^1.1.4
  device_info_plus: ^13.3.0
  equatable: ^2.1.0
  fast_contacts: ^6.0.0
  file_picker: ^13.3.0
  firebase_analytics: ^12.6.1
  firebase_app_check: ^0.4.9
  firebase_auth: ^6.7.1
  firebase_core: ^4.15.2
  firebase_crashlytics: ^5.4.1
  firebase_messaging: ^16.7.1
  firebase_performance: ^0.11.7
  firebase_remote_config: ^6.7.1
  firebase_storage: ^13.6.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  freerasp: ^8.2.4
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  get_it: ^9.3.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  logger: ^2.8.0
  material_ui: ^1.8.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  qr_code_generator: ^1.0.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  test_api: any
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  vibration: ^3.2.1

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  change_app_package_name: ^1.5.0
  fake_cloud_firestore: ^4.4.0
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  go_router_builder: ^4.5.2
  hive_ce_generator: ^1.11.2
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  very_good_analysis: ^11.0.0
  
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: fonts/Manrope-Light.ttf
          weight: 300
        - asset: fonts/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: AROneSans
      fonts:
        - asset: fonts/AROneSans-Regular.ttf
          weight: 400
        - asset: fonts/AROneSans-Medium.ttf
          weight: 500
        - asset: fonts/AROneSans-SemiBold.ttf
          weight: 600
        - asset: fonts/AROneSans-Bold.ttf
          weight: 700
  assets:
    - assets/data/
    - assets/images/
    - assets/images/portraits/
    - assets/icons/
    - fonts/NotoNaskhArabic-Regular.ttf
    - fonts/NotoNaskhArabic-Medium.ttf
    - fonts/NotoNaskhArabic-SemiBold.ttf
    - fonts/NotoNaskhArabic-Bold.ttf
